name: goldenstock
x-app: &app
  build: .
  image: goldenstock:local
  environment: &env
    GS_DATABASE_URL: postgresql+psycopg://goldenstock:${POSTGRES_PASSWORD:?Run python scripts/bootstrap.py first}@db:5432/goldenstock
    GS_DATA_DIR: /app/data
    GS_INFERENCE_URL: http://inference:11434
    GS_WORKER_ID: worker-1
    GS_PUBLIC_URL: http://127.0.0.1:${GS_WEB_PORT:-8080}
    GS_SEC_CONTACT: ${GS_SEC_CONTACT:-}
  volumes:
    - app_data:/app/data
  networks: [private]
  init: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
services:
  db:
    image: postgres:17.7
    environment:
      POSTGRES_USER: goldenstock
      POSTGRES_DB: goldenstock
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python scripts/bootstrap.py first}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [private]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goldenstock -d goldenstock"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
  migrate:
    <<: *app
    command: ["python", "-m", "alembic", "upgrade", "head"]
    depends_on:
      db: {condition: service_healthy}
    restart: "no"
  worker:
    <<: *app
    command: ["python", "-m", "goldenstock.worker"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-m", "goldenstock.check"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
  web:
    <<: *app
    networks: [private, ingress]
    ports: ["127.0.0.1:${GS_WEB_PORT:-8080}:8080"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      worker: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready',timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
  inference:
    image: ollama/ollama:0.13.5
    profiles: [ai]
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_CONTEXT_LENGTH: "4096"
      OLLAMA_KEEP_ALIVE: "0"
      OLLAMA_GPU_OVERHEAD: "2147483648"
    volumes:
      - model_data:/root/.ollama
    networks: [private]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
networks:
  ingress:
  private:
    internal: true
volumes:
  postgres_data:
  app_data:
  model_data:
