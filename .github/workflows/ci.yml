name: Workspace checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install -r requirements-dev.lock
      - run: python -m pytest -q
      - name: Container startup
        run: python scripts/bootstrap.py --up
      - name: Real readiness and private ports
        run: |
          curl --fail --retry 10 --retry-delay 2 http://127.0.0.1:8080/health/ready
          python scripts/check_container_isolation.py
          docker compose exec -T monitor python -m goldenstock.monitor_worker --health
      - name: PostgreSQL concurrency and process-crash recovery
        run: docker compose exec -T web python - < scripts/check_postgres.py
      - name: Local OCR and document extraction
        run: docker compose exec -T worker python - < scripts/check_extraction.py
      - name: Encrypted backup, independent restore and 15 HTTPS sessions
        run: |
          docker build -t goldenstock-ops:local ops
          python scripts/check_recovery.py
      - name: Stop containers without deleting persisted data
        if: always()
        run: if test -f .env; then docker compose down; fi
